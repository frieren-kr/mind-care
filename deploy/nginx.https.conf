# web 컨테이너 — 2단계(HTTPS). /etc/letsencrypt에 인증서가 있어야 뜬다. 1단계는 nginx.conf, 앱 부분은 nginx-app.inc.
# 443은 호스트 nginx(stream, deploy/host-nginx/)가 받아 PROXY protocol을 붙여 127.0.0.1:8443(아래 server)으로 넘긴다.
server_tokens off;

# 80: 인증서 갱신 확인만 받고, 나머지는 도메인 https로 보낸다 (IP로 들어와도)
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location / {
        return 301 https://mindcare-project.duckdns.org$request_uri;
    }
}

server {
    # PROXY protocol 없이 들어온 연결은 받지 않는다 (밖에서는 못 들어온다: compose가 127.0.0.1:8443에만 연다)
    listen 8443 ssl proxy_protocol;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/mindcare-project.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindcare-project.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 호스트 nginx는 도커 게이트웨이(compose 대역 10.231.0.0/24의 첫 주소)로 들어온다.
    # 그 연결만 PROXY protocol 주소를 실제 IP로 믿는다 → $remote_addr가 사용자 IP가 된다 (nginx-app.inc의 /api/ 헤더).
    set_real_ip_from 10.231.0.1;
    real_ip_header proxy_protocol;

    include /etc/nginx/mindcare-app.inc;
}
