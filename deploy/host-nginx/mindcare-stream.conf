# 호스트(서버 본체) nginx용 — 443 하나로 SSH와 HTTPS를 나눠 받는다. 설치·순서는 docs/deploy.md "HTTPS 전환".
# stream은 http 블록 밖(main)에 있어야 한다 → 서버의 /etc/nginx/mindcare-stream.conf로 복사하고
# /etc/nginx/nginx.conf 맨 끝에 한 줄로 불러온다:   include /etc/nginx/mindcare-stream.conf;
# 필요: libnginx-mod-stream (ssl_preread 포함). 호스트 nginx는 80을 쓰지 않는다 (web 컨테이너가 씀).

stream {
    # 접속마다 실제 IP와 간 곳(127.0.0.1:2222 = SSH, 127.0.0.1:8443 = HTTPS)을 남긴다.
    # sshd 로그에는 모든 접속이 127.0.0.1로 보이므로 SSH 접속 IP는 이 로그에서 본다.
    log_format mindcare '$remote_addr [$time_local] $upstream_addr $status $session_time';

    # 첫 패킷이 TLS ClientHello면 버전(TLSv1.3 등), 아니면 빈 값 → SSH로 본다.
    # (OpenSSH·PuTTY는 접속하자마자 자기 버전 문자열을 먼저 보내서 바로 나뉜다)
    map $ssl_preread_protocol $mindcare_upstream {
        ""      127.0.0.1:2222;   # SSH → 아래 내부 server → 22
        default 127.0.0.1:8443;   # HTTPS → web 컨테이너 (nginx.https.conf)
    }

    # 아무것도 오가지 않는 연결을 끊는 시간 (기본 10분이면 가만히 둔 SSH 창이 끊긴다).
    # HTTPS 쪽 유휴 연결은 web 컨테이너 nginx가 먼저 닫는다.
    proxy_timeout 24h;

    server {
        listen 443;
        ssl_preread on;
        proxy_protocol on;    # 넘겨받는 쪽에 실제 접속 IP를 알린다
        proxy_pass $mindcare_upstream;
        access_log /var/log/nginx/mindcare-stream.log mindcare;
    }

    # sshd는 PROXY protocol을 모른다 → 여기서 받아 머리말을 떼고 평문으로 22에 넘긴다.
    server {
        listen 127.0.0.1:2222 proxy_protocol;
        proxy_pass 127.0.0.1:22;
    }
}
