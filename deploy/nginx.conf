# web 컨테이너 — 1단계(HTTP만, 인증서 없어도 뜬다). 앱 부분은 nginx-app.inc.
# 2단계(HTTPS)는 nginx.https.conf. 고르는 법은 docs/deploy.md "HTTPS 전환" (backend/.env의 WEB_NGINX_CONF).
server_tokens off;

server {
    listen 80;
    server_name _;

    include /etc/nginx/mindcare-app.inc;

    # Let's Encrypt 확인 (certbot --webroot가 호스트 /var/www/certbot에 파일을 둔다). 기본 인증이 걸리면 발급이 실패한다.
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }
}
